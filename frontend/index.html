<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Document Summarizer</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#101522;color:#eef}textarea,input,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:9px}button{background:#7c9cff;border:0}pre{white-space:pre-wrap;background:#202a3b;padding:14px}</style><h1>AI Document Summarizer</h1><input id="api" value="https://genai-document-summarizer-api.onrender.com"><textarea id="source" rows="12" placeholder="Paste at least 80 characters"></textarea><input id="style" value="bullet points"><button onclick="go()">Summarize</button><pre id="out"></pre><script>async function go(){let r=await fetch(api.value+'/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:source.value,style:style.value})});out.textContent=JSON.stringify(await r.json(),null,2)}</script></html>
